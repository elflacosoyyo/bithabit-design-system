name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tests, typecheck, token/spec validation, build, and "dist/ is up to date"
      - run: npm run check
      # every story must render (and every play function must pass) in both a light and a dark brand
      - run: npm run build-storybook
      - run: npm run test:stories
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
