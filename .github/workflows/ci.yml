name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tests, typecheck, token/spec validation, builds, and "dist/ and catalog/ are up to date"
      - run: npm run check
      # the catalog file must open as a file and every page and interaction must work
      - run: npm run test:catalog
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
