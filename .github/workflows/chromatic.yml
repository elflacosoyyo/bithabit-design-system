# Publishes Storybook to Chromatic (private by default, access through GitHub) and runs visual regression on every push.
# Disabled until you opt in: create the Chromatic project, then add the repository secret CHROMATIC_PROJECT_TOKEN
# and the repository variable CHROMATIC_ENABLED=true. See docs/storybook.md.
name: Chromatic
on: push
jobs:
  chromatic:
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
