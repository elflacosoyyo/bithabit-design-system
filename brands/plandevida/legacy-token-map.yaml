# SUPERSEDED for colors by tokens/compat.yaml (BitHabit names, generated into dist/<brand>/bithabit-compat.css and the Tailwind preset).
# This file only records what has NO equivalent yet, for the landing site and marketing tokens.
out_of_scope:
  - { legacy: --color-foreground (landing),   note: "Landing ink #1a1a1a; the app ink #030213 is the canonical value" }
  - { legacy: --color-surface-landing,        note: "Landing surface #fdf5eb; not used by the app" }
  - { legacy: --color-splash-dark,            note: "Marketing hover state #c47d33; no app usage found" }
  - { legacy: "--shadow-*",                   note: "Marketing only; the app has no shadows" }
  - { legacy: "--radius-sm/md/lg (landing)",  note: "Computed from --radius in the landing; the app scale (4/8/12) is canonical" }
mapped_one_to_one:
  - "--spacing-{2xs..2xl}  -> spacing.{2xs..2xl}"
  - "--radius-{none..pill} -> radius.{none..pill}"
  - "--text-{xs..4xl}      -> font.size.{xs..4xl}"
  - "--fw-*                -> font.weight.*"
  - "--tracking-*          -> font.tracking.*"
