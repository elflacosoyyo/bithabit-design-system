# Plan de Vida: first client brand built on BITHABIT.
id: plandevida
name: Plan de Vida
owner: Bakia
status: active
extends: bithabit
description: >
  Private, ad-free habit tracker for the daily Catholic spiritual practices ("normas de piedad").
  Near-monochrome warm cream system with a single tan accent. Visual-only customization (v1).
surfaces:
  app: true
  watch: false      # exploration exists (Watch.dc.html); not specified yet
  widget: false     # exploration exists (widget.dc.html); not specified yet
  landing: false    # landing tokens are out of scope for v1
fonts:
  sans:
    family: Inter
    source: Google Fonts (OFL)
  display:
    ios: Yrsa
    android: Yrsa
    web: Yrsa
    notes: >
      Yrsa (OFL, weights 300-700) is bundled by the app and loaded with expo-font. Decision D-05 (closed 2026-10-09):
      Yrsa stays; Kefa III was rejected because it is an Apple system font that cannot be bundled.
logo:
  mark_cream: brands/plandevida/assets/logo-cream.svg
  mark_accent: brands/plandevida/assets/logo-accent.svg
  mark_ink: brands/plandevida/assets/logo-ink.svg
  status: from-figma     # Figma "Splash > Logo", recolored; the app animates it with a Lottie file (assets/animations/logo.json)
  meaning: Stack of overlapping ellipses, read as footprints on a path.
voice:
  language: es          # canonical product voice is Spanish; docs and specs stay in English
  address: tu (informal)
  tone: [plain, devotional, warm, reverent]
  vocabulary:
    - 'User-facing noun is "norma" (plural "normas"), never "hábito".'
    - '"Plan de Vida" is the proper noun for the whole life-rule.'
  rules:
    - Sentence case everywhere. Single-noun screen titles are bare ("Normas").
    - No emoji. No exclamation marks except the chat onboarding.
    - Action-first CTAs ("Marcar como hecha hoy", "Agregar norma").
    - Confirmations are past tense and quiet ("Completada hoy").
    - Empty states are direct, never apologetic.
    - Privacy is a recurring value ("Sin anuncios ni rastreos").
imagery:
  policy: >
    No photography inside the product. Photography is allowed only on marketing/conversion
    surfaces (paywall, onboarding). Decision pending confirmation (see audit/decisions.md D-07).
accessibility:
  target: WCAG 2.2 AA
  waivers:
    - id: PDV-W1
      pair: text.accent-on-*
      reason: >
        Tan (#EDA96D) text on white/cream is about 2:1. Inherited from the production app
        (outline buttons, links such as "Back" and "Add norm").
      recommendation: Introduce a darker tan for TEXT only via color.text.accent, keep fills unchanged.
      status: needs-design-decision
    - id: PDV-W2
      pair: accent-fill-on-*
      reason: Streak strip segments and calendar rings are decorative reinforcement; completion is also shown by the check and the number.
      status: accepted-with-note
    - id: PDV-W3
      pair: brand.splash-fg-on-splash-bg
      reason: The splash mark is a logotype, which WCAG 1.4.3 exempts from contrast requirements.
      status: accepted-with-note
    - id: PDV-W4
      pair: text.secondary-on-input
      reason: Muted text (#717182) on the input fill (#F3F3F5) is 4.32:1 in light mode, just under AA. Inherited from production.
      recommendation: Darken text.secondary slightly (about #6B6B7B) or lighten bg.input.
      status: needs-design-decision
    - id: PDV-W5
      pair: text.destructive-on-*
      reason: Destructive text (#D16161) on white or cream is 3.5 to 3.75:1 ("Delete norm", delete-account confirmation). Inherited from production.
      recommendation: Use a darker red for TEXT (about #B83F3F) and keep #D16161 for fills and icons.
      status: needs-design-decision
    - id: PDV-W6
      pair: text.on-accent-on-*
      reason: >
        Production labels on accent and destructive fills use text-background, which is white in light mode:
        white on tan is 2.00:1 and white on destructive red is about 3.8:1 (ButtonPrimary, ButtonDestructive, swipe actions).
        In dark mode the label is near-black and passes.
      recommendation: Use ink (#030213) for labels on the tan fill (about 9:1); darken the destructive fill or use ink for labels on it.
      status: needs-design-decision
    - id: PDV-W7
      pair: text.positive-on-surface
      reason: Production shows positive change in the brand orange (#D77D2D, text-splash), about 3:1 on the cream surface in light mode (ChangeIndicator).
      recommendation: Use a darker orange for text, or rely on the arrow icon and sign and keep the color decorative.
      status: needs-design-decision
sources:
  - Claude Design export "Plan de Vida Design System" (README, colors_and_type.css, manifest)
  - Figma "Plan de Vida (Copy)" file qWMcWuD7X6qnzXxAmRopvf
  - Reference videos of the production iOS app (Oct 2026)
  - Code repo Bakia/plan-de-vida @ cdfea70 (read-only; global.css, tailwind.config.js, src/components/*)
