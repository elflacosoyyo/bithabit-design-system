id: habit-card
name: HabitCard
version: 0.2.0
status: draft
category: list
summary: Tappable row for one habit with a done-today checkbox and a seven-day history strip underneath.
purpose: >
  Hero component of the Today screen. Lets the user see today's habits at a glance, complete them
  with one tap and open a habit's detail. The history strip is the signature visual pattern of the product.
platforms: [react-native]
surfaces: [app]
anatomy:
  - part: wrapper
    description: Canvas-colored container, top corners rounded (radius-top), clipping its children.
    required: true
  - part: row
    description: Surface-colored row with horizontal and vertical padding md. Holds the title and the checkbox.
    required: true
  - part: title
    description: Habit name, sans, light weight, small size, slightly tracked. Takes the remaining width.
    required: true
  - part: checkbox
    description: Trailing Checkbox that toggles completion for today.
    required: true
  - part: history-strip
    description: Row of equal-width segments under the row, one per day, oldest first and today last. A done day is accent, otherwise surface-alt.
    required: true
props:
  - name: title
    type: string
    required: true
    description: Habit name as written by the user.
  - name: completed
    type: boolean
    required: true
    description: Whether the habit is done today.
  - name: history
    type: boolean[]
    required: true
    description: Completion of the last N days, oldest first, today last. The Home screen passes 7 (one flex segment per entry).
  - name: onToggle
    type: () => void
    required: true
    description: Called when the checkbox is pressed. Never opens the detail.
  - name: onPress
    type: () => void
    required: true
    description: Called when the row outside the checkbox is pressed. Opens the habit detail.
  - name: onLongPress
    type: () => void
    required: false
    description: Optional. The list uses it to start drag-to-reorder.
  - name: disabled
    type: boolean
    required: false
    default: false
    description: Blocks both callbacks. The list sets it on every card while a drag is active.
variants:
  - name: static
    description: HabitCard alone.
  - name: swipeable
    description: SwipeableHabitCard wraps the card (px md, py xs on canvas). Swipe right toggles today, swipe left asks to delete.
states:
  - name: default
    description: Habit not completed today. Checkbox shows the ring.
  - name: completed
    description: Checkbox shows the check glyph. Today's strip segment is accent.
  - name: pressed
    description: Whole card dims while a finger is down (contract is opacity.pressed).
  - name: disabled
    description: Interaction blocked; no visual change in the current implementation.
tokens:
  - habit-card.bg
  - habit-card.wrapper-bg
  - habit-card.text
  - habit-card.font-size
  - habit-card.font-weight
  - habit-card.letter-spacing
  - habit-card.padding-x
  - habit-card.padding-y
  - habit-card.list-padding-x
  - habit-card.list-padding-y
  - habit-card.radius-top
  - habit-card.radius-bottom
  - habit-card.pressed-opacity
  - habit-card.strip.height
  - habit-card.strip.gap
  - habit-card.strip.segments
  - habit-card.strip.segment-filled
  - habit-card.strip.segment-empty
  - habit-card.swipe.toggle-bg
  - habit-card.swipe.delete-bg
  - habit-card.swipe.label
  - habit-card.swipe.label-size
  - habit-card.swipe.label-weight
  - habit-card.swipe.threshold
  - habit-card.swipe.velocity-threshold
  - habit-card.swipe.reveal-width
  - habit-card.swipe.snap-duration
  - habit-card.swipe.return-duration
accessibility:
  role: button
  label: "{title}, completed today | {title}, not completed today"
  touch_target: Row at least 48pt tall. The checkbox needs a 48pt hit area (see Checkbox).
  notes:
    - The strip is decorative. Hide it from assistive tech and expose the count as accessibilityValue ("5 of 7 days").
    - The checkbox is its own accessibility element with role checkbox; do not merge it into the row.
    - Swipe actions must have an accessible alternative (custom accessibility actions "Mark as done" and "Delete").
    - Completion is never conveyed by the strip colour alone; the check glyph carries it.
behavior:
  - Pressing the row opens the habit detail (BottomSheet). Pressing the checkbox toggles today only, with a light haptic.
  - Swipe right past 80pt (or velocity 500) marks done or undoes, with a medium haptic. The row snaps to 100pt in 150ms and returns in 200ms.
  - Swipe left past the same threshold asks for confirmation (native alert) before deleting.
  - Long press starts drag-to-reorder (medium haptic); the other cards are disabled while dragging.
  - In a list each card sits on a canvas wrapper with horizontal padding md and vertical padding xs.
content:
  - Titles are user-owned, sentence case in the seed data (in Spanish, "Minuto heroico", "Evangelio del día").
related: [checkbox, bottom-sheet, metric-card]
sources:
