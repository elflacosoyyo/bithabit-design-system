      commit: cdfea70
      verified: true
code_gaps:
  - No accessibilityRole, accessibilityLabel or accessibilityState on the card or the checkbox.
  - The checkbox hit area is 40pt (24pt plus hitSlop 8); the contract asks for 48pt (hit slop 12).
  - Pressed state is the TouchableOpacity default (0.2); the contract uses opacity.pressed (0.7), as FooterAction already does.
  - Swipe actions have no accessible alternative.
  - Swipe labels use text-background on accent and destructive fills. In Plan de Vida light mode that is white on tan (2.0:1), waiver PDV-W6.
open_questions:
  - Should long titles truncate to one line? Today the title has no numberOfLines and wraps, growing the row.
  - Should the disabled state (set during a drag) have a visual treatment?
changelog:
  - version: 0.2.0
    date: "2026-10-09"
    changes:
      - Verified against Bakia/plan-de-vida at cdfea70. history is boolean[] of the last 7 days (not a streak); strip is 4pt high with a 2pt gap; swipe behavior documented.
      - Added code_gaps (accessibility, hit area, pressed opacity).
  - version: 0.1.0
    date: "2026-10-08"
    changes:
      - Initial draft from reference videos, Figma and the Claude Design export.
