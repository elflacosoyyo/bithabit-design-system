id: segmented-control
name: SegmentedControl
version: 0.2.0
status: draft
category: navigation
summary: Pill-shaped switch between two or three views of the same content.
purpose: >
  Switches content inside one screen (habit detail: Notes / History, or Norm / Notes / History)
  without navigating away. One of the few components that uses the pill radius.
platforms: [react-native]
surfaces: [app]
anatomy:
  - part: track
    description: 36pt-high pill filled with the input background, 2pt inner padding.
    required: true
  - part: thumb
    description: Pill under the selected segment, canvas-colored. It appears instantly; it does not slide.
    required: true
  - part: segment
    description: Equal-width pressable label, centered.
    required: true
props:
  - name: labels
    type: string[]
    required: true
    description: One label per segment, in order.
  - name: selectedIndex
    type: number
    required: true
    description: Index of the selected segment.
  - name: onSelect
    type: "(index: number) => void"
    required: true
    description: Called with the pressed index (also when it is already selected).
  - name: accessibilityLabel
    type: string
    required: false
    description: Contract addition. Names the group for screen readers. Not in the current implementation.
states:
  - name: unselected
    description: Label on the track, medium weight.
  - name: selected
    description: Thumb under the label, semibold weight.
  - name: pressed
    description: Segment dims while pressed.
tokens:
  - segmented-control.height
  - segmented-control.track-bg
  - segmented-control.track-radius
  - segmented-control.track-padding
  - segmented-control.thumb-bg
  - segmented-control.thumb-radius
  - segmented-control.label
  - segmented-control.font-size
  - segmented-control.font-weight-active
  - segmented-control.font-weight-inactive
accessibility:
  role: tablist
  label: Required group label; each segment exposes its own label and selected state.
  touch_target: Each segment is 36pt high today; the contract asks for at least 44pt.
  notes:
    - Expose accessibilityState.selected on the segment; selection must not rely on the thumb alone.
    - Labels stay on one line. If one does not fit, shorten it; never wrap.
behavior:
  - Segments share the width equally.
  - The thumb is a background swap with no animation.
  - Two or three segments are used in the app. More than four is a different pattern (list or menu).
content:
  - Labels are single nouns in sentence case ("Notes", "History").
related: [bottom-sheet]
sources:
  figma:
    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5432:2176"
      name: "Norma detail (instance 'Segmented control')"
  videos:
    - plandevida-ios-part1.mp4 / part2.mp4 (Notes/History, Norm/Notes/History)
  claude_design:
    - "Plan de Vida Design System README (pill track and pill thumb)"
  code:
    - repo: Bakia/plan-de-vida
      path: src/components/segmented-control.tsx
      commit: cdfea70
      verified: true
code_gaps:
  - No accessibilityRole, label or state on the control or its segments.
  - Segment height is 36pt, below the 44pt contract target.
  - Pressed state is the TouchableOpacity default (0.2); the contract uses opacity.pressed (0.7).
  - There is no disabled state.
open_questions:
  - The Settings screen uses a different chip-style selector (Light/Dark/System, EN/ES/PT). Consolidate or specify ChipSelect (audit decision D-08).
  - Dark-mode look (canvas thumb on the input track) has not been checked on a device.
changelog:
  - version: 0.2.0
    date: "2026-10-09"
    changes:
      - Verified against Bakia/plan-de-vida at cdfea70. API is labels, selectedIndex and onSelect. Track uses the input background, not surface-alt.
      - Removed the sliding thumb, disabled state, semantics prop and transition duration (not in the component).
  - version: 0.1.0
    date: "2026-10-08"
    changes:
      - Initial draft from reference videos, Figma and the Claude Design export.
