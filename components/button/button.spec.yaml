    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5464:6425"
      name: "button / text (components also named button / primary, secondary, tertiary)"
    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5464:6422"
      name: button / tertiary (105 by 44)
  videos:
    - plandevida-ios-part1.mp4 / part2.mp4 (Add norm, Delete norm, Cancel)
  claude_design:
    - "Plan de Vida Design System README: 4 button variants, disabled is opacity 0.5, outline border 1.5px"
  code:
    - repo: Bakia/plan-de-vida
      path: src/components/buttons.tsx
      commit: cdfea70
      verified: true
    - repo: Bakia/plan-de-vida
      path: src/screens/demo/button-gallery-screen.tsx
      commit: cdfea70
      verified: true
code_gaps:
  - Production buttons are 48pt high (h-2xl). The contract uses 44pt (D-30, from the Figma) through the button.height token, which is a literal 44px because the spacing scale has no 44.
  - Production rounds every variant with rounded-md (8pt). The contract uses radius.sm (4pt), from the Figma button, through the button.radius token.
  - Four separate components (ButtonPrimary, ButtonOutline, ButtonDestructive, ButtonText) with different prop sets; the contract is one Button with a variant.
  - No accessibilityRole="button" on any variant. Only ButtonDestructive sets accessibilityState (disabled); none expose busy while loading.
  - Pressed state is the TouchableOpacity default (0.2); the contract uses opacity.pressed (0.7).
  - loading is part of the shared props type but ButtonDestructive and ButtonText ignore it.
  - "Icons come from two sets (AntDesign on primary and outline, Feather on destructive) and ButtonDestructive hard-codes its icon color as #FFFFFF."
  - Disabled looks different per variant (opacity 50, faded or neutral fill, a subtle label color for text-destructive).
  - "Production labels on the fills use text-background, white in light mode. The contract uses text.on-accent, which Plan de Vida sets to dark grey #2A2C2D (D-29, from the Figma button / primary): 7.0:1 on tan instead of white at 2.0:1. The destructive label uses text.on-destructive, white on Plan de Vida's darker red (4.89:1, D-31). The outline and text labels are tan on white (waiver PDV-W1)."
open_questions:
  - Figma names the variants primary / secondary / tertiary / text but the code names them primary / outline / destructive / text. Which names are canonical? Decision D-24.
  - Is the Figma "button / tertiary" (105 by 44, a compact size) a real variant, or an old explore? The code has nothing compact.
  - The Figma button / primary (node 2:6) is 105 by 44 with 20pt Inter SemiBold and a 20pt horizontal padding, so it hugs its label. The height is now 44pt in the contract (D-30), as in the Figma. The width (hug versus full width) and the 20pt label versus the code's 17pt are still open. Which is canonical?
  - Should loading be supported on destructive and text variants (the contract assumes yes)?
  - Should the neutral disabled look (used by the delete-account confirm) become the single disabled look for destructive?
changelog:
  - version: 0.2.0
    date: "2026-10-23"
    changes:
      - New tokens button.primary.icon, button.outline.icon and button.destructive.icon, so the icon follows the label color of each variant (dark grey on tan and white on the darker red in Plan de Vida). The icon prop can be a function that receives that color.
  - version: 0.1.3
    date: "2026-10-23"
    changes:
      - The destructive label reads the new text.on-destructive role, and Plan de Vida's destructive red is darker in light mode (D-31), so the white label reaches 4.89:1.
  - version: 0.1.2
    date: "2026-10-23"
    changes:
      - Height is 44pt on every variant (D-30, from the Figma button / primary), through button.height; it was 48pt (spacing.2xl).
  - version: 0.1.1
    date: "2026-10-23"
    changes:
      - Corner radius is 4pt (radius.sm) on every variant, through button.radius; it was radius.md (8pt).
      - "Plan de Vida primary label is dark grey #2A2C2D on tan (D-29, from the Figma button / primary), through the brand's text.on-accent. No token or prop changed."
  - version: 0.1.0
    date: "2026-10-09"
    changes:
      - Initial spec, verified against Bakia/plan-de-vida at cdfea70. One Button contract with six variants covering the four production components.
