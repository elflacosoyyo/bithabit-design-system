    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5464:6425"
      name: "button / text (components also named button / primary, secondary, tertiary)"
    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5464:6422"
      name: button / tertiary (105 by 44)
  videos:
    - plandevida-ios-part1.mp4 / part2.mp4 (Add norm, Delete norm, Cancel)
  claude_design:
    - "Plan de Vida Design System README: 4 button variants, disabled is opacity 0.5, outline border 1.5px"
  code:
    - repo: Bakia/plan-de-vida
      path: src/components/buttons.tsx
      commit: cdfea70
      verified: true
    - repo: Bakia/plan-de-vida
      path: src/screens/demo/button-gallery-screen.tsx
