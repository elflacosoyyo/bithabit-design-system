id: bottom-sheet
name: BottomSheet
version: 0.3.0
status: draft
category: container
summary: Modal sheet that slides up from the bottom over a dimmed backdrop and can be dragged down to dismiss.
purpose: >
  Hosts secondary flows without leaving the current screen: habit detail (Norm / Notes / History),
  suggested habits and similar. Depth comes from the dim backdrop and the large radius, never from a shadow.
platforms: [react-native]
surfaces: [app]
anatomy:
  - part: backdrop
    description: Full-screen flat dim behind the sheet. Pressing it closes the sheet.
    required: true
  - part: sheet
    description: Canvas-colored panel with a 32pt top radius. Height is set by its content unless heightRatio is given; bottom padding is the safe-area inset.
    required: true
  - part: handle
    description: 40pt by 4pt pill centered at the top with 8pt vertical padding. The pan gesture is attached to this region only.
    required: true
  - part: content
    description: Free slot. Padding and scrolling are the content's responsibility.
    required: true
props:
  - name: isOpen
    type: boolean
    required: true
    description: Controls presentation.
  - name: onClose
    type: () => void
    required: true
    description: Called on backdrop press, Android back, or a dismissing drag.
  - name: children
    type: ReactNode
    required: true
    description: Sheet content.
  - name: accessibilityLabel
    type: string
    required: false
    description: Contract addition. Names the sheet for screen readers (usually the title). Not in the current implementation.
  - name: heightRatio
    type: number
    required: false
    description: Fixes the sheet to this fraction of the screen height, whatever its content. The content scrolls inside. The norm detail passes the bottom-sheet.detail-height-ratio token (0.7). Omit it for a content-sized sheet.
states:
  - name: hidden
    description: Not rendered.
  - name: opening
    description: Slides up and the backdrop fades in, 300ms.
  - name: open
    description: Settled at translateY 0.
  - name: dragging
    description: Follows the finger downward only; upward drag is ignored.
  - name: closing
    description: Slides out with an ease-in curve and the backdrop fades, 300ms.
tokens:
  - bottom-sheet.bg
  - bottom-sheet.radius-top
  - bottom-sheet.handle.width
  - bottom-sheet.handle.height
  - bottom-sheet.handle.radius
  - bottom-sheet.handle.bg
  - bottom-sheet.handle.padding-y
  - bottom-sheet.backdrop
  - bottom-sheet.backdrop-opacity
  - bottom-sheet.duration
  - bottom-sheet.drag-threshold
  - bottom-sheet.velocity-threshold
  - bottom-sheet.spring-damping
  - bottom-sheet.spring-stiffness
  - bottom-sheet.detail-height-ratio
accessibility:
  role: dialog
  label: Provide an accessibilityLabel that names the sheet.
  notes:
    - Set accessibilityViewIsModal so screen readers cannot reach the content behind.
    - Move focus to the sheet title on open and back to the trigger on close.
    - The handle is decorative; expose a "dismiss" accessibility action on the sheet instead.
    - Respect Reduce Motion (AccessibilityInfo.isReduceMotionEnabled) by fading instead of sliding.
behavior:
  - Rendered in a transparent Modal with a translucent status bar, so it always sits above navigation.
  - Opening and closing use timing, not a spring. Presenting starts after the Modal is shown.
  - Dragging down past 100pt, or releasing faster than 500pt per second, calls onClose. Otherwise the sheet springs back (damping 25, stiffness 100).
  - No snap points. By default the sheet is content-sized. With heightRatio it is exactly that fraction of the screen height, however short or long its content is, and the content scrolls inside (the norm detail is 70%, decision D-28).
  - The component does not avoid the keyboard; the content that owns the input must.
related: [segmented-control, checkbox, habit-card]
sources:
  figma:
    - file: qWMcWuD7X6qnzXxAmRopvf
      node: "5432:2176"
      name: Norma detail (sheet with Grabber)
  videos:
    - plandevida-ios-part1.mp4 / part2.mp4 (detail sheet, suggested habits sheet, keyboard)
  claude_design:
    - "Plan de Vida Design System README (Reanimated spring, backdrop opacity about 0.5, rounded-t-2xl)"
  code:
    - repo: Bakia/plan-de-vida
      path: src/components/bottom-sheet.tsx
      commit: cdfea70
      verified: true
    - repo: Bakia/plan-de-vida
      path: src/utils/animation-presets.ts
      commit: cdfea70
      verified: true
code_gaps:
  - The norm detail fixes its own height at 78% of the screen (SHEET_HEIGHT_RATIO in habit-detail-screen.tsx) instead of the sheet doing it. The contract asks for 70% (D-28) and moves the fixed height into the sheet through heightRatio.
  - The backdrop is the foreground color at 0.5 opacity. In dark mode that is cream, not a dim. The contract uses the overlay token (bg.overlay), which already exists in the app but is unused.
  - No accessibilityViewIsModal, label or dismiss action; no Reduce Motion handling.
  - The drag gesture covers only the handle region, not the whole header.
open_questions:
  - Confirm that the backdrop should use bg.overlay in both modes (the current dark-mode cream backdrop looks unintended).
  - Should the drag area extend to the sheet title?
changelog:
  - version: 0.3.0
    date: "2026-10-09"
    changes:
      - Added heightRatio and the detail-height-ratio token. The norm detail sheet is a fixed 70% of the screen height (decision D-28); production fixes it at 78% in the screen.
  - version: 0.2.0
    date: "2026-10-09"
    changes:
      - Verified against Bakia/plan-de-vida at cdfea70. Removed snap points, keyboard avoidance and dismissOnBackdropPress (not in the component).
      - Handle is 40pt by 4pt in text.secondary. Open and close are timing animations of 300ms; spring is only used to snap back.
      - Added code_gaps (backdrop color, accessibility).
  - version: 0.1.0
    date: "2026-10-08"
    changes:
      - Initial draft from reference videos, Figma and the Claude Design export.
